[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "openpage"
dynamic = ["version"]
description = "Python thin wrappers for the openpage Rust browser automation core"
readme = "python/README.md"
requires-python = ">=3.10"
authors = [
  { name = "ip2a", email = "ooooofish@126.com" }
]
license = { text = "MIT" }
keywords = ["browser", "automation", "cdp", "python", "pyo3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
]

[tool.maturin]
manifest-path = "rust/bindings/python/Cargo.toml"
module-name = "openpage.openpage_rs"
python-source = "python"
features = ["python-module"]
bindings = "pyo3"
