[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "openpage-rs"
dynamic = ["version"]
description = "PyO3 extension for OpenPage"
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "Cargo.toml"
bindings = "pyo3"
features = ["python-module"]
module-name = "openpage_rs"
