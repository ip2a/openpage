[workspace]
members = [
    "crates/openpage",
    "apps/openpage",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2024"
authors = ["ip2a <ooooofish@126.com>"]
license = "MIT"
repository = "https://github.com/ip2a/openpage"

[workspace.dependencies]
base64 = "0.22.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.1", features = ["derive"] }
cookie_store = "0.22.1"
encoding_rs = "0.8.35"
ego-tree = "0.10.0"
futures = "0.3.31"
getrandom = "0.2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
pyo3 = "0.28.3"
pyo3-build-config = "0.28.3"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "cookies", "json", "rustls"] }
regex = "1.12.2"
publicsuffix = "2.3.0"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
similar = "2"
skyscraper = "0.7.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9.8"
url = "2.5.7"
libc = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }
