[package]
name = "openpage_rs"
version = "0.1.0"
edition = "2024"
description = "openpage Rust browser automation core with PyO3 bindings"

[lib]
name = "openpage_rs"
crate-type = ["cdylib", "rlib"]

[package.metadata.maturin]
python-source = "../python"

[dependencies]
chromiumoxide = "0.9.1"
futures = "0.3.31"
pyo3 = { version = "0.28.3", features = ["extension-module"] }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "cookies", "json", "rustls"] }
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.7"
