name: desktop-build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "desktop/openpage/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    name: tauri-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/openpage/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/openpage
        run: npm ci

      - name: Build desktop application
        working-directory: desktop/openpage
        run: npm run tauri build
