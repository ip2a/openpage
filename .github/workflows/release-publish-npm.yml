# Manually triggered npm publish via OIDC trusted publishing.
name: release-publish-npm

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the release-build workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release source
        shell: bash
        run: |
          test -f npm/packages/openpage/package.json || { echo "[error] Missing npm/packages/openpage/package.json"; exit 1; }
          grep -q 'ROOT / "npm" / "packages"' scripts/release/sync_version.py || { echo "[error] scripts/release/sync_version.py is outdated"; exit 1; }

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Sync versions
        run: python3 scripts/release/sync_version.py

      - name: Download release-build artifacts
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            gh run download "${{ inputs.build_run_id }}" --name "openpage-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble npm platform packages
        run: python3 scripts/release/assemble_npm_packages.py --dist-root dist

      - name: Publish npm platform packages
        run: |
          for pkg in \
            npm/packages/internal/openpage-bin-darwin-arm64 \
            npm/packages/internal/openpage-bin-darwin-x64 \
            npm/packages/internal/openpage-bin-linux-x64-gnu \
            npm/packages/internal/openpage-bin-linux-arm64-gnu \
            npm/packages/internal/openpage-bin-win32-x64-msvc; do
            (cd "$pkg" && npm publish --access public --provenance)
          done

      - name: Publish npm main package
        run: |
          (cd npm/packages/openpage && npm publish --access public --provenance)
