name: post-release-verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to verify (e.g., 0.1.0)"
        required: true
        type: string

jobs:
  verify-npm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04
          - os: windows-latest

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify npm install
        run: |
          npm install -g openpage@${{ inputs.version }}
          openpage --version

  verify-pypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04
          - os: windows-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify PyPI install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpage==${{ inputs.version }}
          python - <<'PY'
          import openpage
          from openpage import openpage_rs

          print("openpage import ok")
          print(openpage.Browser)
          print(openpage_rs.__name__)
          PY

  verify-crates:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crates.io install
        shell: bash
        run: |
          cargo install openpage_rs --version ${{ inputs.version }}
          openpage --version
