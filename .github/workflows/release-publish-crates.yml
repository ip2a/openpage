# Manually triggered crates.io publish via OIDC trusted publishing.
name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Cargo.toml metadata
        shell: bash
        run: |
          grep -q '^readme = "README.md"' rust/crates/openpage/Cargo.toml || { echo "[error] Missing readme field"; exit 1; }
          grep -q '^repository.workspace = true' rust/crates/openpage/Cargo.toml || { echo "[error] Missing repository field"; exit 1; }
          echo "[ok] Cargo.toml metadata valid"

      - name: Dry-run publish
        run: cargo publish --dry-run --manifest-path rust/crates/openpage/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --manifest-path rust/crates/openpage/Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
