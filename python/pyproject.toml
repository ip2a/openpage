[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openpage"
version = "0.1.0"
description = "Python thin wrappers for the openpage Rust browser automation core"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenPage" }
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["openpage"]
